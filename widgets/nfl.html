<link rel="stylesheet" href="widgets/nfl/css/style.css" />

<!-- NFL Scoreboard — list or ticker -->
<script id="tplNflScoreboard"
	type="text/ejs"
	class="vis-tpl"
	data-vis-set="nfl"
	data-vis-type="val"
	data-vis-name="NFL Scoreboard"
	data-vis-update-style="true"
	data-vis-prev='<div style="background:#0D1B2A;border-radius:14px;padding:0;font-family:sans-serif;width:280px;overflow:hidden;border:1px solid #ffffff14"><div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#ffffff1a"><span style="color:#FFD166;font-weight:700;font-size:12px;letter-spacing:.08em">NFL</span><span style="background:#ff3b5c2e;color:#ff8fa3;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700">● LIVE</span></div><div style="padding:10px 14px;border-bottom:1px solid #ffffff14"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="color:#ff8fa3;font-size:10px">Q2 5:32</span><span style="color:#c4b0ff;font-size:10px">LIVE</span></div><div style="display:flex;align-items:center;color:#F5F7FA;gap:8px"><span style="font-weight:700">PHI</span><div style="flex:1;text-align:center;color:#FFD166;font-size:20px;font-weight:800">0 – 7</div><span style="font-weight:700">BAL</span></div></div></div>'
	data-vis-attrs="group.nfl_group_data;instance[nfl.0]/text;group.nfl_group_filter;mode[all]/nselect,all,live,upcoming;favoriteOnly/checkbox;maxGames[16]/number,1,50,1;group.nfl_group_layout;layout[list]/nselect,list,ticker;density[comfortable]/nselect,comfortable,compact;group.nfl_group_display;showLogos[true]/checkbox;showHeader[true]/checkbox;showVenue[true]/checkbox;showBroadcasts/checkbox;group.nfl_group_style;bgColor[#0D1B2A]/color;textColor[#F5F7FA]/color;accentColor[#FFD166]/color">
	<div class="vis-widget"
		id="<%= this.data.attr('wid') %>"
		style="width:100%;height:100%;overflow:hidden;box-sizing:border-box"><%
		vis.binds['nfl'].createScoreboard(this.data.wid, this.view, this.data, this.style);
	%></div>
</script>

<!-- NFL Favorite Team — hero / compact / strip -->
<script id="tplNflFavoriteTeam"
	type="text/ejs"
	class="vis-tpl"
	data-vis-set="nfl"
	data-vis-type="val"
	data-vis-name="NFL Favorite Team"
	data-vis-update-style="true"
	data-vis-prev='<div style="background:#0D1B2A;border-radius:14px;padding:0;font-family:sans-serif;width:260px;overflow:hidden;border:1px solid #ffffff14"><div style="display:flex;justify-content:space-between;padding:12px 14px;background:#ffffff1a"><span style="color:#FFD166;font-weight:700;font-size:12px">Baltimore Ravens</span><span style="background:#ff3b5c2e;color:#ff8fa3;padding:3px 10px;border-radius:999px;font-size:10px">LIVE</span></div><div style="display:flex;justify-content:space-around;align-items:center;padding:18px 12px;color:#F5F7FA"><div style="text-align:center"><div style="font-weight:800">BAL</div></div><div style="font-size:36px;font-weight:800;color:#FFD166">24 – 17</div><div style="text-align:center"><div style="font-weight:800">CIN</div></div></div></div>'
	data-vis-attrs="group.nfl_group_data;instance[nfl.0]/text;group.nfl_group_layout;layout[hero]/nselect,hero,compact,strip;group.nfl_group_display;showLogos[true]/checkbox;showNextFooter[true]/checkbox;showStatsRow[true]/checkbox;showVenue[true]/checkbox;showBroadcasts[true]/checkbox;group.nfl_group_style;bgColor[#0D1B2A]/color;textColor[#F5F7FA]/color;accentColor[#FFD166]/color">
	<div class="vis-widget"
		id="<%= this.data.attr('wid') %>"
		style="width:100%;height:100%;overflow:hidden;box-sizing:border-box"><%
		vis.binds['nfl'].createFavoriteTeam(this.data.wid, this.view, this.data, this.style);
	%></div>
</script>

<!-- NFL Schedule — upcoming list -->
<script id="tplNflSchedule"
	type="text/ejs"
	class="vis-tpl"
	data-vis-set="nfl"
	data-vis-type="val"
	data-vis-name="NFL Schedule"
	data-vis-update-style="true"
	data-vis-prev='<div style="background:#0D1B2A;border-radius:14px;padding:0;font-family:sans-serif;width:300px;overflow:hidden;border:1px solid #ffffff14"><div style="display:flex;justify-content:space-between;padding:12px 14px;background:#ffffff1a"><span style="color:#FFD166;font-weight:700;font-size:12px">NFL SCHEDULE</span><span style="opacity:.65;color:#F5F7FA;font-size:11px">3 games</span></div><div style="display:flex;gap:12px;padding:12px 14px;align-items:center;border-bottom:1px solid #ffffff14"><div style="width:78px;font-size:10px;color:#ffffff88"><strong style="color:#F5F7FA;display:block">Sun Nov 24</strong>8:20 PM</div><div style="flex:1;font-weight:700;color:#F5F7FA">PIT vs NYJ</div><span style="background:#6c2eff38;color:#c4b0ff;padding:3px 10px;border-radius:999px;font-size:10px">UPCOMING</span></div></div>'
	data-vis-attrs="group.nfl_group_data;instance[nfl.0]/text;group.nfl_group_filter;scheduleMode[upcoming]/nselect,upcoming,favorites;maxGames[12]/number,1,32,1;group.nfl_group_layout;density[comfortable]/nselect,comfortable,compact;group.nfl_group_display;showLogos[true]/checkbox;showHeader[true]/checkbox;showVenue[true]/checkbox;group.nfl_group_style;bgColor[#0D1B2A]/color;textColor[#F5F7FA]/color;accentColor[#FFD166]/color">
	<div class="vis-widget"
		id="<%= this.data.attr('wid') %>"
		style="width:100%;height:100%;overflow:hidden;box-sizing:border-box"><%
		vis.binds['nfl'].createSchedule(this.data.wid, this.view, this.data, this.style);

</script>
