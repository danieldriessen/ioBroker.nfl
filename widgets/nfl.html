<!-- ═══════════════════════════════════════════════════════════════════════════
     WIDGET 1 — NFL Scoreboard
     Shows live, upcoming, or all NFL games with scores, clocks, and logos.
     ═══════════════════════════════════════════════════════════════════════════ -->
<script id="tplNflScoreboard"
	type="text/ejs"
	class="vis-tpl"
	data-vis-set="nfl"
	data-vis-type="val"
	data-vis-name="NFL Scoreboard"
	data-vis-update-style="true"
	data-vis-prev='<div style="background:#0d1117;border-radius:8px;padding:0;font-family:sans-serif;width:270px;overflow:hidden"><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #c8a94e28"><span style="color:#c8a94e;font-weight:700;font-size:13px;letter-spacing:.05em">🏈 NFL &nbsp;<span style="font-weight:400;font-size:11px;opacity:.65">Week 2  2026</span></span><span style="background:#c8a94e;color:#000;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.6);display:inline-block"></span>2 LIVE</span></div><div style="padding:8px 14px;background:#161b22;border-bottom:1px solid #ffffff0a"><div style="color:#ff5555;font-size:10px;font-weight:600;letter-spacing:.05em;margin-bottom:5px">● Q2&nbsp;&nbsp;5:32</div><div style="display:flex;align-items:center;gap:8px;color:#e6edf3"><span style="font-size:13px;font-weight:700">PHI</span><div style="flex:1;display:flex;justify-content:center;gap:6px;align-items:center"><span style="font-size:18px;font-weight:700;color:#c8a94e">0</span><span style="color:#e6edf322">–</span><span style="font-size:18px;font-weight:700;color:#c8a94e">7</span></div><span style="font-size:13px;font-weight:700">BAL</span></div></div><div style="padding:8px 14px;border-bottom:1px solid #ffffff0a"><div style="color:#e6edf377;font-size:10px;margin-bottom:5px">Sun, Sep 8&nbsp;&nbsp;4:25 PM</div><div style="display:flex;align-items:center;gap:8px;color:#e6edf3"><span style="font-size:13px;font-weight:700">KC</span><div style="flex:1;display:flex;justify-content:center"><span style="font-size:13px;color:#e6edf344;font-style:italic">vs</span></div><span style="font-size:13px;font-weight:700">CLE</span></div></div></div>'
	data-vis-attrs="group.nfl_group_data;instance[nfl.0]/text;group.nfl_group_filter;mode[all]/nselect,all,live,upcoming;favoriteOnly/checkbox;maxGames[16]/number,1,50,1;group.nfl_group_style;showLogos[true]/checkbox;bgColor[#0d1117]/color;textColor[#e6edf3]/color;accentColor[#c8a94e]/color">
	<div class="vis-widget"
		id="<%= this.data.attr('wid') %>"
		style="width:100%;height:100%;overflow:hidden;box-sizing:border-box"><%
		vis.binds['nfl'].createScoreboard(
			this.data.wid,
			this.view,
			this.data,
			this.style
		);
	%></div>
</script>

<!-- ═══════════════════════════════════════════════════════════════════════════
     WIDGET 2 — NFL Favorite Team
     Shows a single focused card for the configured favorite team:
     live score (if playing), next game (if upcoming), or last result.
     ═══════════════════════════════════════════════════════════════════════════ -->
<script id="tplNflFavoriteTeam"
	type="text/ejs"
	class="vis-tpl"
	data-vis-set="nfl"
	data-vis-type="val"
	data-vis-name="NFL Favorite Team"
	data-vis-update-style="true"
	data-vis-prev='<div style="background:#0d1117;border-radius:8px;padding:0;font-family:sans-serif;width:200px;overflow:hidden"><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #c8a94e28"><span style="color:#c8a94e;font-weight:700;font-size:13px">⭐ Pittsburgh Steelers</span></div><div style="display:flex;flex-direction:column;align-items:center;padding:16px;gap:8px;color:#e6edf3"><img src="https://a.espncdn.com/combiner/i?img=/i/teamlogos/nfl/500/scoreboard/pit.png&amp;w=80&amp;h=80&amp;scale=crop" style="width:72px;height:72px;object-fit:contain" onerror="this.style.display=\'none\'"><div style="font-size:10px;font-weight:700;letter-spacing:.1em;color:#e6edf355;text-transform:uppercase;margin-top:4px">NEXT GAME</div><div style="font-size:13px;font-weight:600;color:#c8a94e">Sun, Sep 8&nbsp;&nbsp;1:00 PM</div><div style="font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px"><img src="https://a.espncdn.com/combiner/i?img=/i/teamlogos/nfl/500/scoreboard/cle.png&amp;w=28&amp;h=28&amp;scale=crop" style="width:24px;height:24px;object-fit:contain" onerror="this.style.display=\'none\'">vs Cleveland Browns</div></div></div>'
	data-vis-attrs="group.nfl_group_data;instance[nfl.0]/text;group.nfl_group_style;showLogos[true]/checkbox;bgColor[#0d1117]/color;textColor[#e6edf3]/color;accentColor[#c8a94e]/color">
	<div class="vis-widget"
		id="<%= this.data.attr('wid') %>"
		style="width:100%;height:100%;overflow:hidden;box-sizing:border-box"><%
		vis.binds['nfl'].createFavoriteTeam(
			this.data.wid,
			this.view,
			this.data,
			this.style
		);
	%></div>
</script>
